# Second SuiteCRM instance for parallel trajectory generation

services:
  mariadb2:
    image: docker.io/bitnami/mariadb:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_suitecrm
      - MARIADB_DATABASE=bitnami_suitecrm
      - MARIADB_PASSWORD=bitnami123
    volumes:
      - "mariadb_data2:/bitnami/mariadb"
      - "./init-db:/docker-entrypoint-initdb.d"
  suitecrm2:
    image: bitnamilegacy/suitecrm:8
    ports:
      - "8081:8080"
    environment:
      - SUITECRM_DATABASE_HOST=mariadb2
      - SUITECRM_DATABASE_PORT_NUMBER=3306
      - SUITECRM_DATABASE_USER=bn_suitecrm
      - SUITECRM_DATABASE_NAME=bitnami_suitecrm
      - SUITECRM_DATABASE_PASSWORD=bitnami123
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - "suitecrm_data2:/bitnami/suitecrm"
    depends_on:
      - mariadb2
volumes:
  mariadb_data2:
    driver: local
  suitecrm_data2:
    driver: local
